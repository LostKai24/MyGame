<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Посадка на Луну 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-item"><span class="hud-label">Время</span><span id="hud-time">0.0 с</span></div>
      <div class="hud-item"><span class="hud-label">Скорость</span><span id="hud-speed">0.0</span></div>
      <div class="hud-item"><span class="hud-label">Топливо</span><span id="hud-fuel">100.0</span></div>
      <div class="hud-item"><span class="hud-label">Цель</span><span id="hud-target">1–3</span></div>
    </header>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="message" class="hidden">
        <h2 id="message-title">Готов?</h2>
        <p id="message-text">Выбери двигатель и топливо, затем нажми «Старт».</p>
        <button id="restart-btn" type="button">Заново</button>
      </div>
    </div>

    <footer id="controls">
      <!-- Выбор двигателя -->
      <div class="control-row">
        <span class="label">Двигатель:</span>
        <div class="engine-buttons" id="engine-container">
          <button class="engine-btn" data-idx="0" type="button">Малый<br><small>10</small></button>
          <button class="engine-btn active" data-idx="1" type="button">Средний<br><small>25</small></button>
          <button class="engine-btn" data-idx="2" type="button">Тяжёлый<br><small>50</small></button>
        </div>
      </div>
      
      <!-- Выбор топлива -->
      <div class="control-row">
        <label for="fuel-slider">Топливо</label>
        <input id="fuel-slider" type="range" min="10" max="1000" value="100" step="10">
        <span id="fuel-value">100</span>
      </div>

      <div class="button-row">
        <button id="start-btn" type="button">Старт</button>
        <button id="burn-btn" type="button">Тяга</button>
        <button id="reset-btn" type="button">Сброс</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
