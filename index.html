<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Посадка на Луну</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-item"><span class="hud-label">Время</span><span id="hud-time">0.0 с</span></div>
      <div class="hud-item"><span class="hud-label">Скорость</span><span id="hud-speed">0.0</span></div>
      <div class="hud-item"><span class="hud-label">Высота</span><span id="hud-height">0</span></div>
      <div class="hud-item"><span class="hud-label">Топливо</span><span id="hud-fuel">100%</span></div>
    </header>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>

      <!-- НОВОЕ: панель масштабирования -->
      <div id="zoom-controls">
        <button id="zoom-in" type="button" title="Приблизить">+</button>
        <button id="zoom-out" type="button" title="Отдалить">−</button>
        <button id="zoom-reset" type="button" title="Сбросить масштаб">⟳</button>
      </div>

      <div id="message" class="hidden">
        <h2 id="message-title">Готов?</h2>
        <p id="message-text">Выбери двигатель и мягко сядь в жёлтую зону</p>
        <button id="restart-btn" type="button">Заново</button>
      </div>
    </div>

    <footer id="controls">
      <div class="control-row">
        <label for="engine">Двигатель</label>
        <select id="engine">
          <option value="light">Лёгкий (слабая тяга, экономичный)</option>
          <option value="standard" selected>Стандартный</option>
          <option value="heavy">Тяжёлый (мощный, жадный)</option>
        </select>
      </div>
      <div class="control-row">
        <label for="throttle">Тяга</label>
        <input id="throttle" type="range" min="0" max="100" value="60" step="1">
        <span id="throttle-value">60%</span>
      </div>

      <div class="control-row engines-row">
        <label>Двигатели</label>
        <div class="engines-grid">
          <button id="engine-left" class="engine-btn" type="button">Левый</button>
          <button id="engine-center" class="engine-btn" type="button">Центр</button>
          <button id="engine-right" class="engine-btn" type="button">Правый</button>
        </div>
      </div>

      <div class="control-row">
        <label>Поворот</label>
        <div class="turn-row">
          <button id="turn-left" type="button" class="turn-btn">←</button>
          <span id="angle-value">90°</span>
          <button id="turn-right" type="button" class="turn-btn">→</button>
        </div>
      </div>
      <div class="button-row">
        <button id="start-btn" type="button">Старт</button>
        <button id="burn-btn" type="button">Тяга</button>
        <button id="reset-btn" type="button">Сброс</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
