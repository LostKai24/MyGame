<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Посадка на Луну 3D</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="game">
    <header id="hud">
      <div class="hud-item"><span class="hud-label">Время</span><span id="hud-time">0.0 с</span></div>
      <div class="hud-item"><span class="hud-label">Скорость</span><span id="hud-speed">0.0</span></div>
      <div class="hud-item"><span class="hud-label">ΔV (Топливо)</span><span id="hud-dv">100.0</span></div>
      <div class="hud-item"><span class="hud-label">Цель</span><span id="hud-target">1–3</span></div>
    </header>

    <div id="canvas-wrap">
      <canvas id="canvas"></canvas>
      <div id="message" class="hidden">
        <h2 id="message-title">Готов?</h2>
        <p id="message-text">Настрой двигатель и жми «Старт»</p>
        <button id="restart-btn" type="button">Заново</button>
      </div>
    </div>

    <footer id="controls">
      <!-- Выбор двигателя -->
      <div class="control-row engine-row">
        <span class="label">Двигатель:</span>
        <div class="engine-buttons">
          <button id="engine-1" class="engine-btn active" type="button">Малый<br><small>V=10</small></button>
          <button id="engine-2" class="engine-btn" type="button">Средний<br><small>V=25</small></button>
          <button id="engine-3" class="engine-btn" type="button">Тяжёлый<br><small>V=50</small></button>
        </div>
      </div>
      
      <!-- Управление поворотом -->
      <div class="control-row">
        <label for="azimuth">Поворот</label>
        <input id="azimuth" type="range" min="0" max="359" value="90" step="1">
        <span id="azimuth-value">90°</span>
      </div>

      <div class="button-row">
        <button id="start-btn" type="button">Старт</button>
        <button id="burn-btn" type="button">Тяга</button>
        <button id="reset-btn" type="button">Сброс</button>
      </div>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
